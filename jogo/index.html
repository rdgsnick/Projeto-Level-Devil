<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Troll Devil</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div id="menu">
  <h1>😈 Troll Devil</h1>
  <p>Setas ou WASD para andar, espaço para pular, Shift para agachar, Q para dar um dash,<br>clique esquerdo para atacar com a espada (segure W/S + clique para bater pra cima/baixo), R para reiniciar a fase.<br>Não confie em nada.</p>
  <input id="nick" maxlength="12" placeholder="Seu nickname">
  <button id="btnJogar">Jogar</button>
  <div id="erro"></div>
  <h3>🏆 Ranking</h3>
  <ol id="rankMenu"></ol>
</div>

<canvas id="game" width="800" height="450"></canvas>
<button id="btnReiniciar">🔄 Reiniciar fase (R)</button>

<div id="fim">
  <h1>Fim de jogo!</h1>
  <h2 id="resultado"></h2>
  <h3>🏆 Ranking</h3>
  <ol id="rankFim"></ol><br>
  <button id="btnNovo">Próximo jogador</button>
</div>

<!-- A ORDEM DESSAS LINHAS IMPORTA: cada arquivo só pode usar o que foi carregado antes dele. -->
